name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo clippy --all-targets --locked --features site -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --features site
      - run: cargo publish --dry-run --locked
      - name: sandbox selftest
        run: |
          cargo build --locked
          ./target/debug/favicons sandbox-selftest render
          for probe in fs write net exec prctl; do
            set +e; ./target/debug/favicons sandbox-selftest "$probe"; code=$?; set -e
            if [ "$code" -ne 159 ]; then echo "probe $probe not killed by seccomp (exit $code)"; exit 1; fi
          done

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
