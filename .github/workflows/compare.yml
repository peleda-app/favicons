name: compare

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - compare/**
      - .github/workflows/compare.yml

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: measure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p _site
          ./compare/measure.sh compare/tools.json > _site/compare.json
          jq . _site/compare.json
          jq -e '.tools | length > 0' _site/compare.json
          cp stats/index.html _site/index.html
          cp stats/index.html _site/404.html
          for f in stats.json banner.png og.png; do
            curl -fsSL "https://stats.favicons.page/$f?v=$(date +%s)" -o "_site/$f" || echo "::warning::$f not carried over"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: measure
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
