name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant: [api, site]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - variant: api
            image: favicons
            features: ""
          - variant: site
            image: favicons.page
            features: site
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: FEATURES=${{ matrix.features }}
          load: true
          tags: favicons:smoke
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ matrix.arch }}
      - name: smoke test
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          docker run --rm favicons:smoke sandbox-selftest render
          for probe in fs write net exec prctl; do
            set +e; docker run --rm favicons:smoke sandbox-selftest "$probe"; code=$?; set -e
            if [ "$code" -ne 159 ]; then echo "probe $probe not killed by seccomp (exit $code)"; exit 1; fi
          done
          docker run -d --name smoke -p 8080:8080 \
            -e FAVICONS_CACHE__STORAGE=s3://favicons-smoke-test/icons \
            -e FAVICONS_CACHE__OPTIONS__AWS_REGION=us-east-1 \
            -e FAVICONS_CACHE__OPTIONS__AWS_ACCESS_KEY_ID=AKIAEXAMPLESMOKE0000 \
            -e FAVICONS_CACHE__OPTIONS__AWS_SECRET_ACCESS_KEY=not-a-secret \
            favicons:smoke
          for _ in $(seq 1 30); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 0.5; done
          curl -fs http://127.0.0.1:8080/healthz || { docker logs smoke; exit 1; }
          headers=$(curl -fsS -D - -o /dev/null http://127.0.0.1:8080/color/example.com)
          echo "$headers"
          echo "$headers" | grep -qi '^content-type: image/svg+xml'
          echo "$headers" | grep -qi '^x-icon-light-plate: #'
          curl -fsS http://127.0.0.1:8080/color/example.com/superellipse/dark | grep -q 'clip-path="url(#plate)"'
          curl -fsS http://127.0.0.1:8080/llms.txt | grep -q '/color/'
          page=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)
          if [ "$VARIANT" = site ]; then
            [ "$page" = 200 ]
            curl -fsS http://127.0.0.1:8080/ | grep -q 'Try any domain'
            curl -fsS -o /dev/null http://127.0.0.1:8080/fonts/archivo.woff2
          else
            [ "$page" = 200 ]
            curl -fsS http://127.0.0.1:8080/ | grep -q '"openapi": "3.1.0"'
          fi
          docker rm -f smoke
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
      - id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: FEATURES=${{ matrix.features }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.arch }}
      - name: export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: digest-${{ matrix.variant }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    strategy:
      matrix:
        include:
          - variant: api
            image: favicons
            prefix: ""
            tags: |
              type=raw,value=latest,enable={{is_default_branch}}
              type=ref,event=branch
              type=semver,pattern={{version}}
              type=semver,pattern={{major}}.{{minor}}
              type=sha,format=short
          - variant: site
            image: favicons.page
            prefix: bare-
            tags: |
              type=raw,value=bare,enable={{is_default_branch}}
              type=sha,format=short,prefix=bare-sha-
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.variant }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: ${{ matrix.tags }}
      - name: create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          refs=()
          for digest in *; do refs+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
      - id: digest
        name: inspect
        env:
          PREFIX: ${{ matrix.prefix }}
        run: |
          docker buildx imagetools inspect "$IMAGE:${PREFIX}sha-${GITHUB_SHA::7}"
          digest=$(docker buildx imagetools inspect "$IMAGE:${PREFIX}sha-${GITHUB_SHA::7}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
      - uses: docker/login-action@v3
        if: vars.DOCKERHUB_USERNAME != '' && matrix.variant == 'api'
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: mirror to Docker Hub
        if: vars.DOCKERHUB_USERNAME != '' && matrix.variant == 'api'
        env:
          HUB: docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          mapfile -t tags < <(jq -r --arg hub "$HUB" '.tags[] | sub("^[^:]+"; $hub) | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create "${tags[@]}" "$IMAGE@$DIGEST"
          docker buildx imagetools inspect "$HUB:sha-${GITHUB_SHA::7}" --format '{{json .Manifest}}' | jq -r .digest | grep -qx "$DIGEST"
      - uses: actions/attest-build-provenance@v2
        if: vars.DOCKERHUB_USERNAME != '' && matrix.variant == 'api'
        with:
          subject-name: docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
      id-token: write
      attestations: write
    env:
      OWNER: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: extract binaries from the images
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir dist
          for pair in favicons:favicons:sha favicons-site:favicons.page:bare-sha; do
            name="${pair%%:*}"; rest="${pair#*:}"; image="${rest%%:*}"; tag="${rest#*:}-${GITHUB_SHA::7}"
            for arch_pair in amd64:x86_64 arm64:aarch64; do
              platform="${arch_pair%%:*}"; arch="${arch_pair##*:}"
              id=$(docker create --platform "linux/$platform" "$OWNER/$image:$tag")
              docker cp "$id:/favicons" "dist/$name-$version-$arch-linux-musl"
              docker rm "$id" >/dev/null
            done
          done
          (cd dist && sha256sum favicons* > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/favicons*
      - name: create release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  crates:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - id: auth
        uses: rust-lang/crates-io-auth-action@v1
        continue-on-error: true
      - name: publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::no trusted publishing and no CARGO_REGISTRY_TOKEN; skipping crates.io"
            exit 0
          fi
          tag="${GITHUB_REF_NAME#v}"
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          [ "$tag" = "$version" ] || { echo "tag $tag does not match Cargo.toml version $version"; exit 1; }
          cargo publish --locked
