name: dockerhub

on:
  push:
    branches: [main]
    paths:
      - docs/DOCKERHUB.md
      - .github/workflows/dockerhub.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  description:
    if: vars.DOCKERHUB_USERNAME != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/favicons
          short-description: Any website's icon as a clean, safe SVG with light and dark theme colours. 9 MB, sandboxed.
          readme-filepath: docs/DOCKERHUB.md
          enable-url-completion: true
