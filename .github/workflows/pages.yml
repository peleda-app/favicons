name: pages

on:
  workflow_run:
    workflows: [docker]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: actions/configure-pages@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: assemble site
        run: |
          mkdir _site
          cp -r site/index.html site/favicon.svg site/data site/icons _site/
          touch _site/.nojekyll
      - name: extract binaries from the image
        run: |
          tag="sha-${SHA::7}"
          for pair in amd64:x86_64 arm64:aarch64; do
            platform="${pair%%:*}"; arch="${pair##*:}"
            mkdir -p "_site/dl/$arch"
            id=$(docker create --platform "linux/$platform" "$IMAGE:$tag")
            docker cp "$id:/favicons" "_site/dl/$arch/favicons"
            docker rm "$id" >/dev/null
            (cd "_site/dl/$arch" && sha256sum favicons > favicons.sha256)
          done
          echo "$SHA" > _site/dl/COMMIT
          cat _site/dl/*/favicons.sha256
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
