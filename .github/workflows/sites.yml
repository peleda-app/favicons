name: sites

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      limit:
        description: how many top sites to prerender
        default: "100000"
  push:
    branches: [main]
    paths:
      - catalogs/sites.py
      - catalogs/sites.Dockerfile
      - .github/workflows/sites.yml

permissions:
  contents: read

concurrency:
  group: sites
  cancel-in-progress: false

env:
  SHARDS: 20

jobs:
  list:
    runs-on: ubuntu-24.04
    outputs:
      shards: ${{ steps.split.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - name: build the list
        env:
          LIMIT: ${{ inputs.limit || '100000' }}
        run: python3 -I catalogs/sites.py --limit "$LIMIT" --out domains.txt --sources SOURCES.md
      - id: split
        name: split into shards
        run: |
          mkdir shards
          split -n "l/$SHARDS" -d -a 2 domains.txt shards/shard-
          wc -l shards/*
          echo "shards=$(find shards -type f -printf '%f\n' | sort | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: list
          path: |
            domains.txt
            SOURCES.md
            shards/
          retention-days: 7

  render:
    needs: list
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.list.outputs.shards) }}
    env:
      BASE: ghcr.io/${{ github.repository_owner }}/favicons.page:bare
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: list
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: prerender
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p out && chmod 0777 out
          printf '[render]\ndecode_concurrency = %s\n\n[fetch]\nworkers = 32\n\n[policy]\nmin_domain_age_days = 0\n\n[catalog.thesvg]\nenabled = true\nlicenses = ["CC0-1.0", "Unlicense", "MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "CC-BY-4.0", "CC-BY-3.0"]\n\n[cache]\nstorage = "file:///out"\n' "$(nproc)" > prerender.toml
          docker run --rm -v "$PWD/prerender.toml:/etc/prerender.toml:ro" -v "$PWD/shards/$SHARD:/list.txt:ro" \
            -v "$PWD/out:/out" "$BASE" prerender-domains /list.txt --config /etc/prerender.toml
          echo "icons: $(find out/v4 -mindepth 1 -maxdepth 1 | wc -l) of $(wc -l < "shards/$SHARD")"
          docker run --rm -v "$PWD/out:/out" "$BASE" pack /out "/out/$SHARD.pack"
          ls -la "out/$SHARD.pack"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.shard }}
          path: out/${{ matrix.shard }}.pack
          retention-days: 7

  image:
    needs: render
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      actions: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/favicons-sites
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - name: collect the packs
        run: |
          mkdir -p catalogs/sites
          cp parts/shard-*/*.pack catalogs/sites/
          cp parts/list/domains.txt parts/list/SOURCES.md catalogs/sites/
          ls -la catalogs/sites
          du -sh catalogs/sites
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        name: build and push
        run: |
          docker buildx build catalogs -f catalogs/sites.Dockerfile \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE:latest" -t "$IMAGE:$(date -u +%Y-%m-%d)" \
            --metadata-file /tmp/meta.json --push
          echo "digest=$(jq -r '."containerimage.digest"' /tmp/meta.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: rebuild the site image
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run catalogs.yml --ref main
