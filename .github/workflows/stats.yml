name: stats

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: stats-state-${{ github.run_id }}
          restore-keys: stats-state-
      - name: merge counters
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ vars.CF_ZONE_ID }}
        run: |
          mkdir -p state _site
          python3 stats/update.py state/stats.json _site/stats.json \
            https://favicons.page/stats https://stats.favicons.page/stats.json
          cp _site/stats.json state/stats.json
          cp stats/index.html _site/index.html
          cp stats/index.html _site/404.html
          curl -fsSL "https://stats.favicons.page/compare.json?v=$(date +%s)" -o _site/compare.json \
            || echo "::warning::compare.json not carried over"
      - uses: actions/cache/save@v4
        with:
          path: state
          key: stats-state-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: collect
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
