[package]
name = "favicons"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Privacy-first favicon and logo API: any site's icon as a clean, sandboxed SVG with light and dark theme colours"
repository = "https://github.com/peleda-app/favicons"
homepage = "https://favicons.page"
documentation = "https://github.com/peleda-app/favicons/blob/main/docs/API.md"
readme = "README.md"
keywords = ["favicon", "icons", "svg", "logo", "api"]
categories = ["web-programming::http-server", "multimedia::images", "command-line-utilities"]
include = [
  "/src/**/*.rs",
  "/site/robots.txt",
  "/site/llms.txt",
  "/config.example.toml",
  "/README.md",
  "/LICENSE",
]

[features]
default = []
site = []

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio", "query", "tracing"] }
base64 = "0.22"
blake3 = "1"
bytes = "1"
figment = { version = "0.10", features = ["toml", "env"] }
hickory-resolver = { version = "0.26", features = ["tokio", "https-ring", "tls-ring", "webpki-roots"] }
http = "1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["server", "server-auto", "tokio", "http1", "http2", "service"] }
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg", "gif", "webp", "bmp"] }
mimalloc = { version = "0.1.52", default-features = false }
moka = { version = "0.12", features = ["future", "sync"] }
object_store = { version = "0.14", features = ["aws-base", "gcp-base", "azure-base", "reqwest", "ring"] }
percent-encoding = "2"
psl = "2"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "charset", "json", "gzip", "brotli", "deflate"] }
resvg = { version = "0.45", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustix = { version = "1", features = ["process", "thread"] }
scraper = { version = "0.23", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs", "process", "io-util"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
visioncortex = "0.8"
webpki-roots = "1"
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
x509-parser = { version = "0.17", default-features = false }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
ring = { version = "0.17", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
seccompiler = "0.5"
