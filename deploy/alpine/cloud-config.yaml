#cloud-config
# favicons on Alpine Linux, configured entirely by tiny-cloud at first boot.
# Fill in the values marked <...>. VERSION is a release tag without the
# leading v, FAVICONS_SHA256 its x86_64 line from SHA256SUMS. github.com has
# no IPv6, so the instance needs IPv4 or NAT64 to download the release.

ssh_authorized_keys:
  - <SSH_PUBLIC_KEY>

packages:
  - nftables
  - curl

write_files:
  - path: /etc/favicons/config.toml
    permissions: "0644"
    content: |
      [server]
      listen = "[::1]:8080"

      [client_ip]
      # Only Cloudflare can reach ports 80/443 (see /etc/nftables.nft),
      # so its client IP header can be trusted.
      source = "cf-connecting-ip"

      [fetch]
      workers = 4

      [render]
      decode_concurrency = 1

      [cache]
      storage = "/var/cache/favicons"
      max_disk_bytes = 5_000_000_000

      [policy]
      # The demo at / sends a letter from malware.testcategory.com, Cloudflare's
      # malware test host; requests collapse to testcategory.com, so block that.
      blocklists = ["/etc/favicons/blocklist.txt"]

      [tls]
      enabled = true
      domains = ["<DOMAIN>"]
      state_dir = "/var/lib/favicons/acme"

  - path: /etc/favicons/blocklist.txt
    permissions: "0644"
    content: |
      testcategory.com

  - path: /etc/init.d/favicons
    permissions: "0755"
    content: |
      #!/sbin/openrc-run
      name="favicons"
      command="/usr/local/bin/favicons"
      command_args="--config /etc/favicons/config.toml"
      command_user="favicons:favicons"
      supervisor="supervise-daemon"
      respawn_delay=2
      respawn_max=0
      output_log="/var/log/favicons.log"
      error_log="/var/log/favicons.log"

      depend() {
        need net
        after firewall nftables chronyd
      }

      start_pre() {
        checkpath -d -o favicons:favicons -m 0700 /var/lib/favicons /var/lib/favicons/acme
        checkpath -d -o favicons:favicons -m 0750 /var/cache/favicons
        checkpath -f -o favicons:favicons -m 0640 /var/log/favicons.log
      }

  - path: /etc/conf.d/favicons
    permissions: "0644"
    content: |
      export FAVICONS_LOG="warn,favicons::tls=info,favicons::server=info"
      rc_cgroup_settings="memory.max 600M"

  - path: /etc/sysctl.d/favicons.conf
    permissions: "0644"
    content: |
      net.ipv4.ip_unprivileged_port_start = 80

  - path: /etc/chrony/chrony.conf
    permissions: "0644"
    content: |
      server time.cloudflare.com iburst nts
      pool 2.pool.ntp.org iburst
      initstepslew 10 time.cloudflare.com
      driftfile /var/lib/chrony/chrony.drift
      rtcsync
      cmdport 0

  - path: /etc/nftables.nft
    permissions: "0644"
    content: |
      #!/usr/sbin/nft -f
      flush ruleset
      table inet filter {
        set cloudflare6 {
          type ipv6_addr
          flags interval
          elements = { 2400:cb00::/32, 2606:4700::/32, 2803:f800::/32, 2405:b500::/32,
                       2405:8100::/32, 2a06:98c0::/29, 2c0f:f248::/32 }
        }
        chain input {
          type filter hook input priority 0; policy drop;
          ct state established,related accept
          ct state invalid drop
          iif lo accept
          meta l4proto ipv6-icmp accept
          meta l4proto icmp accept
          ip6 saddr fd00:42::/64 accept
          udp dport 546 accept
          tcp dport 22 accept
          ip6 saddr @cloudflare6 tcp dport { 80, 443 } accept
        }
        chain forward {
          type filter hook forward priority 0; policy drop;
        }
      }

  - path: /usr/local/sbin/favicons-setup
    permissions: "0755"
    content: |
      #!/bin/sh
      set -eu
      bin=/usr/local/bin/favicons
      curl -fsSL --retry 5 -o "$bin.new" https://github.com/peleda-app/favicons/releases/download/v<VERSION>/favicons-<VERSION>-x86_64-linux-musl
      echo "<FAVICONS_SHA256>  $bin.new" | sha256sum -c -
      chmod 0755 "$bin.new"
      mv "$bin.new" "$bin"
      addgroup -S favicons 2>/dev/null || true
      adduser -S -D -H -h /var/lib/favicons -s /sbin/nologin -G favicons favicons 2>/dev/null || true
      sysctl -p /etc/sysctl.d/favicons.conf
      rc-service chronyd restart
      rc-update add nftables default
      rc-service nftables restart
      rc-update add favicons default
      rc-service favicons start

runcmd:
  - /usr/local/sbin/favicons-setup > /var/log/favicons-setup.log 2>&1
